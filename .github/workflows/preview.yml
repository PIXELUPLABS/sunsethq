name: Cloudflare preview

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  # An upload must finish its access checks before another run replaces it.
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  preview:
    name: Deploy branch preview
    if: github.repository == 'SunsetsHQ/replay-marketing' && github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - name: Build private preview
        env:
          TURNSTILE_STAGING_SITE_KEY: ${{ vars.TURNSTILE_STAGING_SITE_KEY }}
        run: npm run staging:build
      - name: Upload and verify preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run preview:deploy

  comment:
    name: Link preview in pull requests
    needs: preview
    permissions:
      deployments: read
      pull-requests: write
    uses: ./.github/workflows/preview-comment.yml
    with:
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
