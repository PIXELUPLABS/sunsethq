name: Preview comment

on:
  # Also handles PRs opened after their branch has already deployed.
  pull_request:
    types: [opened]
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      sha:
        required: true
        type: string
      removed:
        type: boolean
        default: false
      url:
        type: string
        default: ""

permissions:
  deployments: write
  pull-requests: write

concurrency:
  group: preview-comment-${{ inputs.branch || github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.repository == 'SunsetsHQ/replay-marketing' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This job never checks out or executes PR code, or receives deployment secrets.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_BRANCH: ${{ inputs.branch || github.event.pull_request.head.ref }}
          PREVIEW_SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}
          PREVIEW_REMOVED: ${{ inputs.removed }}
          PREVIEW_URL: ${{ inputs.url }}
        with:
          script: |
            const { createHash } = require('node:crypto');
            const { owner, repo } = context.repo;
            const branch = process.env.PREVIEW_BRANCH;
            const sha = process.env.PREVIEW_SHA;
            const removed = process.env.PREVIEW_REMOVED === 'true';
            if (!branch || branch === 'main' || !/^[a-f0-9]{40}$/.test(sha)) {
              throw new Error('Invalid preview branch or commit.');
            }
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', head: `${owner}:${branch}`, per_page: 100,
            });
            const owned = pulls.filter(pr => pr.head.repo?.full_name === `${owner}/${repo}` && pr.head.ref === branch);
            const marker = '<!-- replay-cloudflare-preview -->';
            const removedDescription = 'Preview removed after PR closure.';
            if (removed) {
              if (owned.some(pr => pr.state === 'open')) return;
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner, repo, environment: 'preview', per_page: 100,
              });
              const refs = new Set([branch, `refs/heads/${branch}`, ...owned.map(pr => `refs/pull/${pr.number}/merge`)]);
              for (const deployment of deployments.filter(item => refs.has(item.ref))) {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id: deployment.id, state: 'inactive',
                  description: removedDescription, environment_url: '', auto_inactive: false,
                });
              }
              for (const pr of owned.filter(pr => pr.state === 'closed')) {
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
                const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
                const body = `${marker}\n\n**Cloudflare preview removed.**\n\nThis pull request was ${pr.merged_at ? 'merged' : 'closed'}. Its branch and commit preview versions have been deleted.`;
                if (existing) {
                  if (existing.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                }
              }
              return;
            }
            const matching = owned.filter(pr => pr.state === 'open' && pr.head.sha === sha);
            if (!matching.length) {
              core.info('No open pull request at this preview commit.');
              return;
            }
            // Reopened PR deployments use GitHub's merge ref, while the site
            // is built from the head commit. Prefer the verified job output.
            let deployedUrl = process.env.PREVIEW_URL;
            if (!deployedUrl) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, sha, ref: branch, environment: 'preview', per_page: 1,
              });
              if (!deployments.length) return;
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployments[0].id, per_page: 100,
              });
              // A different branch can mark this shared environment inactive.
              if (!['success', 'inactive'].includes(statuses[0]?.state)) return;
              if (statuses[0]?.description === removedDescription) return;
              deployedUrl = statuses.find(status => status.state === 'success')?.environment_url;
              if (!deployedUrl) return;
            }
            const slug = branch.toLowerCase().replace(/[^a-z0-9-]/g, '-').slice(0, 24);
            const hash = createHash('sha256').update(branch).digest('hex').slice(0, 8);
            const url = `https://b-${slug}-${hash}-replay-marketing-staging.replay-marketing-dev.workers.dev`;
            if (deployedUrl !== url) throw new Error('Unexpected preview deployment URL.');
            const body = [
              marker,
              `**Cloudflare preview ready:** [Open preview](${url})`,
              `Deployed commit: [\`${sha.slice(0, 7)}\`](https://github.com/${owner}/${repo}/commit/${sha})`,
              'Sign in with your **@sunsethq.com** email. Signup forms use the development CRM.',
              'This comment updates after each successful deployment. The preview is removed when the PR is merged or closed.',
            ].join('\n\n');
            for (const pr of matching) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
              if (existing) {
                if (existing.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
            }
